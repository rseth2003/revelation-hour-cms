<VirtualHost *:80>
    ServerName example.org
    ServerAlias www.example.org
    DocumentRoot /var/www/rhmi/public

    <Directory /var/www/rhmi/public>
        AllowOverride All
        Require all granted
        Options -Indexes +FollowSymLinks
    </Directory>

    <FilesMatch "^\.">
        Require all denied
    </FilesMatch>

    LimitRequestBody 576716800
    ErrorLog ${APACHE_LOG_DIR}/rhmi-error.log
    CustomLog ${APACHE_LOG_DIR}/rhmi-access.log combined
</VirtualHost>
