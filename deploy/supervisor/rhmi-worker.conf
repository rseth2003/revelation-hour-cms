[program:rhmi-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/rhmi/artisan queue:work --sleep=3 --tries=3 --timeout=120 --max-time=3600
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=1
redirect_stderr=true
stdout_logfile=/var/www/rhmi/storage/logs/worker.log
stopwaitsecs=3600
